# Rally on Fly.io.
#
#   fly launch --no-deploy --name rally --region iad   # first time only
#   fly secrets set GEMINI_API_KEY=... ELEVENLABS_API_KEY=...
#   fly deploy
#
# Two settings here are load-bearing and both fail as "the game randomly forgot
# our match" rather than as an error: `auto_stop_machines` and the machine count.
# See the comments on each.

app = "rally"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  RALLY_SERVE_STATIC = "1"
  # Concurrency is capped process-wide against the ElevenLabs key. Three is safe
  # on the small plans; raise it if yours allows more.
  ELEVENLABS_CONCURRENCY = "3"

[http_service]
  internal_port = 8787
  # iOS grants motion sensors only over HTTPS, so a phone that reaches the plain
  # HTTP origin loads the page and then refuses to be a paddle.
  force_https = true

  # Rooms, live matches and the commentator's narrative memory all live in this
  # process's memory. Suspending the machine does not pause a game, it deletes
  # one — and it would do it during the idle seconds of a lobby, which is exactly
  # when someone is waiting for a friend to scan a code.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    # Each player is one display socket plus one phone socket, so a "connection"
    # is roughly half a player.
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    # The listener answers a moment before the tick loop starts.
    grace_period = "20s"

[[vm]]
  # A 60 Hz authoritative tick is sensitive to CPU steal, and shared-cpu-1x shows
  # it as dropped ticks under load. If /healthz reports `tick.dropped` climbing
  # during a match, move to `performance-1x`.
  size = "shared-cpu-2x"
  memory = "1gb"
